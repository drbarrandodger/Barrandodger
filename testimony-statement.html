<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full statement of testimony — Author’s Account</title>
<link rel="stylesheet" href="assets/style.css"></head>
<body>
<p style="font-family:Georgia,serif;padding:1rem">Loading full statement…</p>
<script>
Promise.all([
  fetch('data/testimony-s0.html').then(r=>{if(!r.ok)throw new Error('s0 '+r.status);return r.text()}),
  fetch('data/testimony-s1.html').then(r=>{if(!r.ok)throw new Error('s1 '+r.status);return r.text()})
]).then(parts=>{document.open();document.write(parts.join(''));document.close();})
.catch(e=>{document.body.innerHTML='<p style="padding:1rem;font-family:Georgia,serif">Failed to load statement. '+e+'</p><p style="padding:1rem"><a href="testimony.html">Back</a> · <a href="testimony-techniques.html">Techniques page</a></p>';});
</script>
</body></html>
