<meta name="description" content="Barran Dodger public documentary archive — The Witness Remains"/>

<style>
:root{--bg:#070b10;--panel:#0e151d;--panel2:#151f29;--ink:#eef3f7;--muted:#a9b4bf;--line:#293642;--accent:#f1c75b;--link:#8fc9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
#chrome{position:sticky;top:0;z-index:50;background:rgba(7,11,16,.98);border-bottom:1px solid var(--line)}
#chrome header{padding:18px 16px 10px;max-width:1200px;margin:0 auto}
.eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
#chrome h1{font-size:clamp(1.2rem,4vw,1.75rem);margin:4px 0 0;line-height:1.2}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:8px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:8px;white-space:nowrap;cursor:pointer;font:inherit}
.tab.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
#content{max-width:1200px;margin:0 auto;padding:20px 16px 80px;min-height:60vh}
#content .loading{color:var(--muted);padding:2rem 0}
#content .error{color:#f0a080;padding:1rem 0}
#content a{color:var(--link)}
#content .src-root{display:block;color:var(--ink);font:inherit;line-height:1.55}
#content img{max-width:100%;height:auto}
#content .video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;margin:12px 0;overflow:hidden;border-radius:8px}
#content .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#open-source{display:inline-block;margin:0 0 14px;font-size:.9rem;color:var(--muted)}
#open-source a{color:var(--link)}
#content a.src-link{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
#content a.src-link:hover{color:#fff}
</style>
</head>

<script src="linkify-sources.js"></script>
<script>
(function(){
  var ROUTES = {
  "home": "tabs/home.html",
  "crimes": "tabs/crimes.html",
  "manifesto": "tabs/manifesto.html",
  "pids": "tabs/pids-all.html",
  "legal-brief": "legal-brief.html",
  "personal-statement-exile": "tabs/personal-statement-exile.html",
  "witness": "tabs/witness.html",
  "able-point": "tabs/able-point-exile.html",
  "who": "tabs/who.html",
  "timeline": "tabs/timeline.html",
  "evidence": "evidence/allegation-matrix.html",
  "official": "tabs/exhibits.html",
  "declarations": "tabs/pids.html",
  "legal-affidavits": "tabs/exhibits.html",
  "police-statement": "tabs/exhibits.html",
  "good-bits": "tabs/the-good-bits.html",
  "tv-recording": "tabs/tv-wifi-audio.html",
  "record-essay": "tabs/record-that-refused-to-disappear.html",
  "ahrc-letter": "tabs/ahrc-4jul2023.html",
  "family-notice": "tabs/family-notice.html",
  "documents": "tabs/exhibits.html",
  "primary": "SOURCES.html",
  "named-evidence": "tabs/exhibits.html",
  "video-exhibit": "tabs/home.html",
  "legal": "legal-brief.html",
  "fedcourt": "tabs/n03-federal-court-dss-comcare.html",
  "ndis": "tabs/able-point-exile.html",
  "pm": "tabs/exhibits.html",
  "ombudsman": "tabs/n02-pids-recorded-outcomes.html",
  "legalaid": "tabs/exhibits.html",
  "coag": "tabs/exhibits.html",
  "archive": "SOURCES.html",
  "significance": "tabs/ahrc-gangstalking-significance.html",
  "opening": "tabs/home.html",
  "reckoning": "tabs/record-that-refused-to-disappear.html",
  "aiarchive": "tabs/ai.html",
  "methods": "techniques.html",
  "digital": "tabs/apocalypse.html",
  "prophecy": "tabs/prophecy.html",
  "destroy": "tabs/soul.html",
  "gospels": "tabs/god.html",
  "essays": "tabs/record-that-refused-to-disappear.html",
  "entities": "tabs/who.html",
  "doctrine": "tabs/method.html",
  "god": "tabs/god.html",
  "chosen": "tabs/witness.html",
  "soul": "tabs/soul.html",
  "architectureerase": "techniques.html",
  "aliens": "tabs/ten.html",
  "methodology": "tabs/method.html",
  "verification": "tabs/exhibits.html",
  "open": "tabs/challenge.html",
  "architecture": "techniques.html",
  "trust": "tabs/exhibits.html",
  "source-record": "SOURCES.html",
  "species": "tabs/ten.html",
  "forensic": "tabs/forensic-command.html",
  "sources": "SOURCES.html"
  };
  var tabsEl = document.getElementById('tabs');
  var content = document.getElementById('content');
  var cache = {};

  function setActive(id){
    tabsEl.querySelectorAll('button').forEach(function(b){
      var on = b.getAttribute('data-page') === id;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function extractBody(html){
    /* COMMAND: NEVER delete a single word. Only strip script tags so they do not double-run. */
    var m = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    var inner = m ? m[1] : html;
    inner = inner.replace(/<script[\s\S]*?<\/script>/gi, '');
    return inner;
  }

  async function show(id){
    var href = ROUTES[id];
    if(!href){ content.innerHTML = '<p class="error">Unknown section.</p>'; return; }
    setActive(id);
    history.replaceState(null, '', '#' + id);
    content.innerHTML = '<p class="loading">Loading full text (every word)…</p>';
    try{
      var html;
      if(cache[href]){
        html = cache[href];
      } else {
        var res = await fetch(href, {cache: 'no-cache'});
        if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
        html = await res.text();
        cache[href] = html;
      }
      var body = extractBody(html);
      content.innerHTML = '<p id="open-source">Full source (every word preserved): <a href="' + href + '" target="_blank" rel="noopener">' + href + '</a></p><div class="src-root">' + body + '</div>';
      window.scrollTo(0, 0);
      if(window.linkifySources){ window.linkifySources(content); }
    } catch(err){
      content.innerHTML = '<p class="error">Could not load this section in-page.</p><p><a href="' + href + '">Open full page → ' + href + '</a></p>';
    }
  }

  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-page]');
    if(b) show(b.getAttribute('data-page'));
  });

  var start = (location.hash || '#home').slice(1);
  if(!ROUTES[start]) start = 'home';
  show(start);
})();
</script>
</body>
